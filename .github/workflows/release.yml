name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Check version match
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          node -e "
            const pkgVer = 'v' + require('./package.json').version;
            const tauriVer = 'v' + require('./src-tauri/tauri.conf.json').version;
            const tagVer = process.env.GITHUB_REF_NAME;
            if (pkgVer !== tagVer || tauriVer !== tagVer) {
              console.error('Error: Version mismatch! package.json: ' + pkgVer + ', tauri.conf.json: ' + tauriVer + ', Tag: ' + tagVer);
              process.exit(1);
            }
            console.log('Success: Version matches tag');
          "
      - uses: oven-sh/setup-bun@v2
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile
      - name: Get app version and changelog
        id: get_version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          {
            echo "body<<CHANGELOG_EOF"
            node -e '
              const fs = require("fs");
              const tag = process.argv[1];
              let body = "See CHANGELOG.md for details.";
              if (fs.existsSync("CHANGELOG.md")) {
                const lines = fs.readFileSync("CHANGELOG.md", "utf8").split(/\r?\n/);
                const start = lines.findIndex((l) => l.startsWith("## [" + tag + "]"));
                if (start !== -1) {
                  let end = lines.findIndex((l, i) => i > start && l.startsWith("## ["));
                  if (end === -1) end = lines.length;
                  const section = lines.slice(start + 1, end).join("\n").trim();
                  if (section) body = section;
                }
              }
              console.log(body);
            ' "$TAG"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.get_version.outputs.version }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('SSHBool {0}', github.ref_name) || format('SSHBool {0}', steps.get_version.outputs.version) }}
          releaseBody: ${{ steps.get_version.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
